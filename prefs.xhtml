<groupbox xmlns:html="http://www.w3.org/1999/xhtml" onload="(function(){
  var PREFIX = 'extensions.paper-partner.';
  var ORCA_ENDPOINT = 'https://api.orcarouter.ai/v1/chat/completions';
  var DEFAULTS = {
    provider: 'custom',
    apiKey: '',
    apiEndpoint: 'https://api.deepseek.com/v1/chat/completions',
    model: 'deepseek-chat',
    orcaApiKey: '',
    orcaModel: 'orcarouter/free',
    answerMode: 'brief',
    triggerDelay: 'medium'
  };
  function read(key) {
    try {
      var v = Zotero.Prefs.get(PREFIX + key, true);
      return (v !== undefined &amp;&amp; v !== null) ? v : DEFAULTS[key];
    } catch(e) { return DEFAULTS[key]; }
  }
  var provider = document.getElementById('pp-provider');
  provider.value = read('provider') === 'orcarouter' ? 'orcarouter' : 'custom';
  function isOrca() { return provider.value === 'orcarouter'; }
  function prefKey(key) {
    return isOrca() ? ({ apiKey: 'orcaApiKey', model: 'orcaModel' }[key] || key) : key;
  }
  function loadConnection() {
    ['apiKey', 'apiEndpoint', 'model'].forEach(function(key) {
      var el = document.getElementById('pp-' + key);
      el.value = isOrca() &amp;&amp; key === 'apiEndpoint' ? ORCA_ENDPOINT : read(prefKey(key));
      el.readOnly = isOrca() &amp;&amp; key === 'apiEndpoint';
    });
    document.getElementById('pp-endpointRow').hidden = isOrca();
    document.getElementById('pp-orcaNotice').hidden = !isOrca();
  }
  provider.addEventListener('change', function() {
    Zotero.Prefs.set(PREFIX + 'provider', provider.value, true);
    loadConnection();
  });
  ['apiKey', 'apiEndpoint', 'model', 'answerMode', 'triggerDelay'].forEach(function(key) {
    var el = document.getElementById('pp-' + key);
    if (key === 'answerMode' || key === 'triggerDelay') el.value = read(key);
    function save() {
      if (isOrca() &amp;&amp; key === 'apiEndpoint') return;
      Zotero.Prefs.set(PREFIX + prefKey(key), el.value, true);
    }
    el.addEventListener('input', save);
    el.addEventListener('change', save);
  });
  loadConnection();
})()">
  <label><html:h2>Paper Partner</html:h2></label>

  <hbox align="center" style="margin-top: 8px">
    <label value="Provider" style="min-width: 110px"/>
    <html:select id="pp-provider" flex="1" style="margin-left: 4px">
      <html:option value="custom">Custom</html:option>
      <html:option value="orcarouter">OrcaRouter</html:option>
    </html:select>
  </hbox>

  <html:p id="pp-orcaNotice" hidden="hidden" style="margin: 8px 0 4px; line-height: 1.5">
    OrcaRouter is a third-party gateway. Avoid sensitive notes and check model prices; free availability can change.
    <html:a href="https://www.orcarouter.ai/privacy.html" onclick="Zotero.launchURL(this.href); return false;">Privacy</html:a>
  </html:p>

  <hbox align="center" style="margin-top: 8px">
    <label value="API Key" style="min-width: 110px"/>
    <html:input type="password" id="pp-apiKey" flex="1" style="margin-left: 4px"/>
  </hbox>

  <hbox id="pp-endpointRow" align="center" style="margin-top: 6px">
    <label value="API Endpoint" style="min-width: 110px"/>
    <html:input type="text" id="pp-apiEndpoint" flex="1" style="margin-left: 4px"/>
  </hbox>

  <hbox align="center" style="margin-top: 6px">
    <label value="Model" style="min-width: 110px"/>
    <html:input type="text" id="pp-model" flex="1" style="margin-left: 4px"/>
  </hbox>

  <hbox align="center" style="margin-top: 6px">
    <label value="Answer Mode" style="min-width: 110px"/>
    <html:select id="pp-answerMode" flex="1" style="margin-left: 4px">
      <html:option value="brief">Brief</html:option>
      <html:option value="detailed">Detailed</html:option>
    </html:select>
  </hbox>

  <hbox align="center" style="margin-top: 6px">
    <label value="Trigger Delay" style="min-width: 110px"/>
    <html:select id="pp-triggerDelay" flex="1" style="margin-left: 4px">
      <html:option value="immediate">Immediate (0s)</html:option>
      <html:option value="short">Short (1s)</html:option>
      <html:option value="medium">Medium (2s)</html:option>
      <html:option value="long">Long (3s)</html:option>
    </html:select>
  </hbox>
</groupbox>
